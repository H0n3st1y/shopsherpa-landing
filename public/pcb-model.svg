<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">MiniUAV Guardian 3D PCB model</title>
  <desc id="desc">An isometric 3D-style MiniUAV Guardian flight controller PCB with ESP32 module, PIR sensor header, motor pads, power rails, vias, copper traces, and mounting holes.</desc>
  <defs>
    <linearGradient id="scene" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071621"/>
      <stop offset=".58" stop-color="#061419"/>
      <stop offset="1" stop-color="#02080d"/>
    </linearGradient>
    <linearGradient id="boardTop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#29bd8c"/>
      <stop offset=".48" stop-color="#13765e"/>
      <stop offset="1" stop-color="#0d2b35"/>
    </linearGradient>
    <linearGradient id="boardEdge" x1="0" x2="1">
      <stop offset="0" stop-color="#073a36"/>
      <stop offset=".55" stop-color="#0b5a49"/>
      <stop offset="1" stop-color="#031b21"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" x2="1">
      <stop offset="0" stop-color="#e8d5b0"/>
      <stop offset=".52" stop-color="#fff0cb"/>
      <stop offset="1" stop-color="#b98944"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#243b4a"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" x2="1">
      <stop offset="0" stop-color="#d8efe5"/>
      <stop offset=".5" stop-color="#7fa59c"/>
      <stop offset="1" stop-color="#f7fff9"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="36" stdDeviation="34" flood-color="#01070b" flood-opacity=".65"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="980" fill="url(#scene)"/>
