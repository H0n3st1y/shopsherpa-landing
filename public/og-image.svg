<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ShopSherpa online shopping safety layer</title>
  <desc id="desc">ShopSherpa brand card for scam detection, phishing protection, fake seller alerts, and safer checkout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FAF8F4"/>
      <stop offset=".58" stop-color="#F4F0E8"/>
      <stop offset="1" stop-color="#dfeee8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102a3a"/>
      <stop offset="1" stop-color="#071621"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#1d9e75"/>
      <stop offset="1" stop-color="#2e6273"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0d1f2d" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1005" cy="120" r="220" fill="#2e6273" opacity=".08"/>
  <circle cx="160" cy="560" r="240" fill="#1d9e75" opacity=".08"/>
  <g filter="url(#shadow)">
    <rect x="70" y="72" width="1060" height="486" rx="44" fill="#fff" stroke="#2e6273" stroke-opacity=".12"/>
    <rect x="704" y="116" width="354" height="398" rx="30" fill="url(#panel)"/>
    <g transform="translate(758 172)">
      <rect x="0" y="0" width="246" height="170" rx="22" fill="#0d1f2d" stroke="#ffffff" stroke-opacity=".1"/>
      <rect x="24" y="30" width="124" height="14" rx="7" fill="#fff" opacity=".18"/>
      <rect x="24" y="60" width="176" height="12" rx="6" fill="#fff" opacity=".09"/>
      <rect x="24" y="90" width="148" height="12" rx="6" fill="#fff" opacity=".09"/>
      <rect x="24" y="128" width="96" height="24" rx="12" fill="#1d9e75"/>
      <path d="M196 38l18 18 36-42" fill="none" stroke="#1d9e75" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(770 384)">
      <rect x="0" y="0" width="232" height="70" rx="22" fill="#1d9e75" opacity=".13" stroke="#1d9e75" stroke-opacity=".35"/>
      <circle cx="38" cy="35" r="12" fill="#1d9e75"/>
      <text x="66" y="42" fill="#d8efe5" font-family="Arial, sans-serif" font-size="22" font-weight="700">Threat blocked</text>
    </g>
  </g>
  <g transform="translate(132 138)">
    <text x="0" y="0" fill="#2e6273" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="3">SHOPSHERPA / SHOP SHERPA</text>
    <text x="0" y="112" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="82" font-weight="800">Catch the scam</text>
    <text x="0" y="202" fill="#1a1a1a" font-family="Arial, sans-serif" font-size="82" font-weight="800">before you pay.</text>
    <text x="0" y="274" fill="#5f5a55" font-family="Arial, sans-serif" font-size="28">Fake seller alerts, phishing protection,</text>
    <text x="0" y="314" fill="#5f5a55" font-family="Arial, sans-serif" font-size="28">review scanning, and safer checkout signals.</text>
    <rect x="0" y="366" width="238" height="52" rx="26" fill="url(#green)"/>
    <text x="32" y="400" fill="#fff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Join the beta</text>
  </g>
</svg>
